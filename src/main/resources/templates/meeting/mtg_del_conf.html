<!DOCTYPE html>
<html lang="ja" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

    <!-- ヘッダー読み込み -->
    <div th:include="common/header"></div>
    <!-- ヘッダー読み込み -->
    <!-- div th:include="::commonHeader"></div>  -->
    
    <title>打ち合わせ情報削除確認</title>
    <body>
        <!-- 打ち合わせ情報削除確認 -->
        <h1 id="acount">打ち合わせ情報削除確認</h1>
		<h2 align="center" th:text="${message}"></h2>
		
        <form th:action="@{/account_delete_comp}" method="post">
           <div class="contact-form">
            <!-- 入力内容表示 -->
                <table>
                    <tr>
                    	<th>打ち合わせ担当者名(主担当)</th>
                    	<td style="width:200px;"><p th:text="${userId}"></td>
                   	</tr>
                    <tr>
                    	<th>打ち合わせ担当者名(副担当)</th>
                    	<td><p th:text="${subUserId}"></td></tr>
                   	<tr>
                   		<th>相手会社名</th>
                    	<td><p th:text="${clientCompName}"></td>
                   	</tr>
                    <tr>
                    	<th>相手氏名</th>
                    	<td><p th:text="${clientName}"></td>
                   	</tr>
                   	<tr>
                   		<th>予定日</th>
                    	<td><p th:text="${scheduledDate}"></td>
                   	</tr>
                    <tr>
                    	<th>予定時刻</th>
                    	<td><p th:text="${scheduledTime}"></td>
                   	</tr>
                   	<tr>
                   		<th>会議室番号</th>
                    	<td><p th:text="${roomId}"></td>
                   	</tr>
                    <tr>
                    	<th>その他打ち合わせ場所</th>
                    	<td><p th:text="${mtgPlace}"></td>
                   	</tr>
                   	<tr>
                   		<th>目的</th>
                    	<td><th:block th:each="purpose : ${purposeList}" th:if="${purpose.mtgId == mtgId}">
							<p th:text="${purpose.mtgName}">
						</th:block></td>
					</tr>
                    <tr>
                    	<th>コメント</th>
                    	<td><p th:text="${comment}"></td>
                   	</tr>
                </table>
            </div>
      	</form>
      	
            <!-- ボタンエリア -->
            <div style="text-align: center;">
            	<form th:action="@{/mtg_delete_comp}" method="post">
            
            		<!-- 戻るボタン -->
	            	<input type="button" value="戻る" style="margin-top:20px;" onclick="location.href=' mtg_list'" >
	            	
	            	<!-- 情報保持 -->
	            	<input type="hidden" name="scheduleId" th:value="${scheduleId}">
                    <input type="hidden" name="userId" th:value="${userId}">
                    <input type="hidden" name="subUserId" th:value="${subUserId}">
                    <input type="hidden" name="clientCompName" th:value="${clientCompName}">
                    <input type="hidden" name="clientName" th:value="${clientName}">
                    <input type="hidden" name="scheduledDate" th:value="${scheduledDate}">
                    <input type="hidden" name="scheduledTime" th:value="${scheduledTime}">
                    <input type="hidden" name="roomId" th:value="${roomId}">
                    <input type="hidden" name="mtgPlace" th:value="${mtgPlace}">
                    <input type="hidden" name="purpose" th:value="${mtgId}">
                    <input type="hidden" name="comment" th:value="${comment}">
                    <input type="hidden" name="lastUpdateDate" th:value="${lastUpdateDate}">
                    <!-- 削除確定ボタン -->
                    <input type="submit" value="確定" style="margin-top:20px;">
               	</form>
            </div>
        <!-- フッター読み込み -->
        <div th:include="common/footer"></div>
    </body>
</html>
