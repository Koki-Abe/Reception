<!DOCTYPE html>
<html lang="ja" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

    <!-- ヘッダー読み込み -->
    <div th:include="common/header"></div>
    <!-- ヘッダー読み込み -->
    <!-- div th:include="::commonHeader"></div>  -->
    
    <title>アカウント情報変更</title>
    <body>
        <h1 id="acount">アカウント情報変更</h1>

        <!-- エラー文言表示部分 -->
        <th:block th:if="${errMsg}">
            <p style="color: red;" align="center" th:text="${errMsg}" id="errmsg">
        </th:block>
        
        <form th:action="@{/account_update_conf}" method="post">
           <div class="contact-form" id="clearForm">
            <!-- 変更フォーム -->
                <table>
                    <tr><th>ユーザーID</th><td><input type="text" id="userId" name="userId" th:value="${userId}" pattern="^[0-9A-Za-z]+$" title="半角英数字で入力して下さい。"></td></tr>
                    <tr><th>ユーザー名</th><td><input type="text" name="userName" th:value="${userName}"></td></tr>
                    <tr><th>部署</th><td>
                        <select name="department" th:value="${department}">
                            <option
                            	id="department"
                                th:each="dep : ${depList}"
                                th:value="${dep.depId}"
                                th:text="${dep.depName}"
                                th:selected="${dep.depId == department}">
                           </option>
                        </select>
                    </td></tr>
                    <tr><th>ロール</th><td>
                        <select id="role" name="role">
                            <option
                                th:each="auth : ${authList}"
                                th:value="${auth.authId}"
                                th:text="${auth.authName}"
                                th:selected="${auth.authId == role}">
                           </option>
                        </select>
                    </td></tr>
                </table>
            </div>
        
        	<!-- 変更前情報保持 -->
            <input type="hidden" name="oldUserId" th:value="${oldUserId}">
            <input type="hidden" name="oldUserName" th:value="${oldUserName}">
            <input type="hidden" name="oldDepartment" th:value="${oldDepartment}">
            <input type="hidden" name="oldRole" th:value="${oldRole}">
      		<input type="hidden" name="lastUpdateDate" th:value="${lastUpdateDate}">
		      		
            <!-- ボタンエリア -->
            <div style="text-align: center;"> 
            	<input type="button" value="戻る"  onclick="location.href=' account_list'" >
                <input type="button" value="クリア" style="margin-top:20px;" onclick="clearText()" />
                <input type="submit" value="変更" style="margin-top:20px;">
            </div>
        </form>
        <!-- フッター読み込み -->
        <div th:include="common/footer"></div>
    </body>
</html>
